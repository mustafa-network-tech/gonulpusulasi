    const listView = document.getElementById('listView');
    const writingList = document.getElementById('writingList');
    const readerView = document.getElementById('readerView');
    const paper = document.getElementById('paper');
    const copy = document.getElementById('copy');
    const textElement = document.getElementById('writingText');
    const logoElement = document.getElementById('paperLogo');
    const finalSignature = document.getElementById('finalSignature');
    const controls = document.getElementById('controls');
    const backButton = document.getElementById('backButton');
    const replayButton = document.getElementById('replayButton');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let activeIndex = -1;
    let runId = 0;

    writings.forEach((writing, index) => {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.className = 'kh-writing-button';
      button.type = 'button';
      button.textContent = writing.title;
      button.addEventListener('click', () => openWriting(index));
      item.appendChild(button);
      writingList.appendChild(item);
    });

    function validUrl(value){ return /^https?:\/\//i.test(value); }
    function validBackground(value){
      return validUrl(value) || /^assets\/images\/[a-zA-Z0-9._-]+$/.test(value);
    }
    function wait(milliseconds){ return new Promise(resolve => setTimeout(resolve, milliseconds)); }
    function scrollWriting(){
      const lineHeight = parseFloat(getComputedStyle(copy).lineHeight) || 38;
      copy.scrollTop = Math.max(0, copy.scrollHeight - copy.clientHeight + lineHeight * 2);
    }

    async function typeText(element, value, speed, currentRun){
      if(reducedMotion){ element.textContent = value; scrollWriting(); return; }
      for(const character of value){
        if(currentRun !== runId) return;
        element.textContent += character;
        scrollWriting();
        await wait(speed);
      }
    }

    async function playWriting(){
      const writing = writings[activeIndex];
      const currentRun = ++runId;
      copy.classList.remove('is-fading');
      finalSignature.classList.remove('is-visible');
      textElement.innerHTML = '';
      const paragraphs = writing.text.map(value => {
        const paragraph = document.createElement('p');
        paragraph.textContent = value;
        paragraph.style.visibility = 'hidden';
        textElement.appendChild(paragraph);
        return paragraph;
      });
      copy.scrollTop = 0;

      await wait(reducedMotion ? 0 : 650);
      for(const [index, paragraphText] of writing.text.entries()){
        if(currentRun !== runId) return;
        const paragraph = paragraphs[index];
        paragraph.style.minHeight = `${paragraph.offsetHeight}px`;
        paragraph.textContent = '';
        paragraph.style.visibility = 'visible';
        await typeText(paragraph, paragraphText, 48, currentRun);
        if(index < writing.text.length - 1) await wait(reducedMotion ? 0 : 520);
      }
      if(currentRun !== runId) return;
      await wait(2000);
      if(currentRun !== runId) return;
      copy.classList.add('is-fading');
      finalSignature.classList.add('is-visible');
    }

    function openWriting(index){
      activeIndex = index;
      const writing = writings[index];
      listView.hidden = true;
      readerView.classList.add('is-open');
      controls.classList.add('is-open');
      paper.style.backgroundImage = validBackground(writing.backgroundUrl) ? `url("${writing.backgroundUrl}")` : 'none';
      if(validUrl(LOGO_URL)) logoElement.src = LOGO_URL;
      else logoElement.removeAttribute('src');
      playWriting();
    }

    function returnToList(){
      runId++;
      activeIndex = -1;
      readerView.classList.remove('is-open');
      controls.classList.remove('is-open');
      listView.hidden = false;
      copy.classList.remove('is-fading');
      finalSignature.classList.remove('is-visible');
      textElement.innerHTML = '';
    }

    backButton.addEventListener('click', returnToList);
    replayButton.addEventListener('click', playWriting);
  </script>
</body>
