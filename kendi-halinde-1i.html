<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 kendi hâlinde 1i 🕊️</title>
  <link rel="stylesheet" href="assets/css/kendi-halinde.css">
</head>
<body>
  <main class="kh-page">
    <section class="kh-list-view" id="listView" aria-labelledby="mainTitle">
      <h1 class="kh-main-title" id="mainTitle">🌿 kendi hâlinde 1i 🕊️</h1>
      <ol class="kh-writing-list" id="writingList"></ol>
    </section>

    <section class="kh-reader-view" id="readerView" aria-live="polite">
      <article class="kh-paper" id="paper">
        <div class="kh-copy" id="copy">
          <div class="kh-message" id="writingText"></div>
        </div>
        <img class="kh-logo" id="paperLogo" alt="" aria-hidden="true">
        <div class="kh-final-signature" id="finalSignature">🌿 kendi hâlinde 1i 🕊️</div>
      </article>
    </section>

    <nav class="kh-controls" id="controls" aria-label="Yazı kontrolleri">
      <button class="kh-control" id="backButton" type="button">← Yazılara Dön</button>
      <button class="kh-control" id="replayButton" type="button">Yeniden Oku</button>
    </nav>
  </main>

  <script>
    const LOGO_URL = "https://mustafa-network-tech.github.io/photo-url/images/doga/logo-transparent-v2.png";
    const writings = [
  {
    "title": "— İNSAN SESSİZCE DEĞİŞİR",
    "text": [
      "Bazı insanlar sessizce değişir…\nKimse fark etmez içinde kopanları.\nAynı yüzle devam eder hayata,\nsadece eskisi kadar kimseye inanmaz.",
      "Sonra bir gün anlarsın;\nmesele yalnız kalmak değilmiş.\nİnsan en çok, yanlış insanların yanında\nkendinden uzak kalınca yoruluyormuş. 🕊️"
    ],
    "backgroundUrl": "https://mustafa-network-tech.github.io/photo-url/images/doga/IMG_3825.JPG"
  },
  {
    "title": "— HER GİDEN EKSİLTMEZ",
    "text": [
      "Her giden bir şey eksiltmez insandan…\nBazıları giderken yükünü de götürür.\nSen bunu önce yalnızlık sanırsın,\nzaman geçince adına huzur dersin.",
      "Çünkü hayat herkesi yanında tutmak değil;\nkimin yanında kendin kalabildiğini bilmektir.\nBazen en güzel başlangıç,\narkandan kapanan bir kapıyla gelir. 🕊️"
    ],
    "backgroundUrl": "https://mustafa-network-tech.github.io/photo-url/images/doga/IMG_5392.JPG"
  },
  {
    "title": "— BAZI ŞEYLER SESSİZ BİTER",
    "text": [
      "Bazı şeyler kavga ederek bitmez…\nNe ağır sözler söylenir,\nne de büyük vedalar edilir.\nİnsan sadece içinden vazgeçer.",
      "Bir sabah aynı yere bakarsın,\nama artık aynı şeyi hissetmezsin.\nÇünkü bazı vedalar kapıda değil,\ninsanın kalbinde çoktan yaşanmıştır. 🕊️"
    ],
    "backgroundUrl": "https://mustafa-network-tech.github.io/photo-url/images/doga/IMG_5666.JPG"
  },
  {
    "title": "— HERKES AYNI YERDEN BAKMAZ",
    "text": [
      "Güneş herkese doğar…\nAma herkes aynı yerden bakmaz.\nKimi yalnızca yeni bir günü görür,\nkimi karanlıktan nasıl çıktığını hatırlar.",
      "Bu yüzden kimsenin sessizliğini küçümseme.\nBelki sen onun bugününü görüyorsun,\nama o yeniden ayağa kalkabilmek için\nkaç geceyle savaştığını biliyor. 🕊️"
    ],
    "backgroundUrl": "https://mustafa-network-tech.github.io/photo-url/images/doga/mart%C4%B1_g%C3%BCnbat%C4%B1m%C4%B1deniz.JPG"
  },
  {
    "title": "— GEÇ KALMIŞ DEĞİLSİN",
    "text": [
      "Bazen hayat durmuş gibi gelir…\nHerkes bir yerlere yetişirken\nsen aynı yerde kalmışsın sanırsın.\nOysa her insanın zamanı başka akar.",
      "Belki yolun biraz uzun sürecek,\nbelki bazı şeyler seni geç bulacak.\nAma doğru zamanda gelen bir güzellik,\ngeç kalmış sayılmaz. 🕊️"
    ],
    "backgroundUrl": "https://mustafa-network-tech.github.io/photo-url/images/gonul-pusulasi/IMG_6411.JPG"
  },
  {
    "title": "— KALBİNİ HERKESE AÇMA",
    "text": [
      "İyi olmak herkese inanmak değildir…\nKalbin temiz olabilir,\nama karşına çıkan herkes\naynı temiz niyetle gelmez.",
      "Bu yüzden sevginden vazgeçme,\nsadece onu kime verdiğini iyi bil.\nÇünkü güzel bir kalbin en büyük hatası,\nherkesi kendisi gibi sanmaktır. 🕊️"
    ],
    "backgroundUrl": "assets/images/ask1.jpg"
  },
  {
    "title": "— BAZEN UZAKLAŞMAK GEREKİR",
    "text": [
      "Bazı insanlardan nefret ederek değil,\nkendini korumak için uzaklaşırsın.\nÇünkü her mücadele kazanılmak için değil,\nbazıları bitirilmek için vardır.",
      "Bir süre sonra fark edersin;\ngitmek her zaman vazgeçmek değildir.\nBazen insan kendine dönebilmek için\nbaşkasından uzaklaşmak zorundadır. 🕊️"
    ],
    "backgroundUrl": "assets/images/ask2.jpg"
  },
  {
    "title": "— İNSAN EN ÇOK GÜVENDİĞİ YERDE KIRILIR",
    "text": [
      "Yabancıların sözü kolay unutulur…\nİnsanı asıl susturan,\n“o yapmaz” dediği birinin\nhiç beklemediği anda değişmesidir.",
      "Sonra eskisi gibi kızamazsın bile.\nSadece içinde bir kapı sessizce kapanır.\nÇünkü bazı kırgınlıkların ardından\nözür gelir ama eski güven gelmez. 🕊️"
    ],
    "backgroundUrl": "assets/images/ask3.jpg"
  },
  {
    "title": "— HUZURUN KIYMETİNİ BİL",
    "text": [
      "Bir zamanlar peşinden koştuğun şeylerin\nbugün seni hiç ilgilendirmediğini görürsün.\nİnsan büyüdükçe istekleri değil,\nöncelikleri değişir.",
      "Sonunda çok şey istemezsin hayattan;\nsamimi birkaç insan, sakin bir gönül…\nÇünkü insan belli bir yaştan sonra\nheyecandan çok huzuru arıyor. 🕊️"
    ],
    "backgroundUrl": "assets/images/ask4.jpg"
  },
  {
    "title": "— BİR GÜN HER ŞEY YERİNE OTURUR",
    "text": [
      "Bugün anlam veremediğin şeyler olabilir…\nNeden gittiğini, neden olmadığını,\nneden bu kadar beklediğini\nkendine defalarca sorabilirsin.",
      "Ama hayat bazen cevabı hemen vermez.\nZaman geçer, parçalar yerine oturur.\nSonra dönüp baktığında dersin ki:\niyi ki bazı dualarım olmamış. 🕊️"
    ],
    "backgroundUrl": "assets/images/ask5.jpg"
  },
  {
    "title": "— YİNE DE GÜZEL ŞEYLER OLACAK",
    "text": [
      "İnsan bazen çok yorulur…\nNe yeni bir başlangıca gücü vardır,\nne de geçmişe dönecek isteği.\nSadece biraz sessizlik ister.",
      "Ama hiçbir gece sonsuza kadar sürmez.\nBir gün hiç beklemediğin bir anda\nhayat sana yeniden gülümser.\nYeter ki kalbinin ışığını tamamen söndürme. 🕊️"
    ],
    "backgroundUrl": "assets/images/ask6.jpg"
  },
{
  "title": "— EN ÇOK SANA ANLATMAK İSTEDİM",
  "text": [
    "Bugün güzel bir şey oldu…\nElim yine telefona gitti.\nİnsan bazen birinin yokluğunu,\nsevincini paylaşamayınca anlıyor.",
    "Sonra sustum, denize baktım.\nDalgalar kıyıya bir şeyler anlattı.\nBen seni en çok, içimde kalan\nküçücük bir “duysaydın” kadar özledim. 🕊️"
  ],
  "backgroundUrl": "assets/images/kh-12.png"
},
{
  "title": "— BU KEZ KENDİMİ BEKLETMEYECEĞİM",
  "text": [
    "Bir mesaj gelir diye kaç akşam\nışığını açık bıraktım içimin.\nSenin yolun bana düşmedi,\nben kendime dönmeyi erteledim.",
    "Bu gece telefonu sessize aldım.\nÇayı henüz sıcakken içtim.\nBirinden haber beklemeden de\nhayat devam ediyormuş, öğrendim. 🕊️"
  ],
  "backgroundUrl": "assets/images/kh-13.png"
},
{
  "title": "— UNUTMADIM, ARTIK ACIMIYOR",
  "text": [
    "Adını duyunca hâlâ hatırlıyorum.\nO sokağı, o akşamı, son bakışını…\nAma artık bir şarkı çaldığında\ngünüm yarıda kalmıyor.",
    "Dün yine aynı kıyıdan geçtim.\nBu kez denizin rengini fark ettim.\nMeğer iyileşmek biraz da\nsenden başka şeyler görebilmekmiş. 🕊️"
  ],
  "backgroundUrl": "assets/images/kh-14.png"
},
{
  "title": "— KİMSE BİLMEDİ AMA SEN BAŞARDIN",
  "text": [
    "Sabah kalkıp perdeyi açtın.\nOysa gece ne çok yorulmuştun.\nKimse bunu bir zafer saymadı,\nsen o sabaha zor kavuşmuştun.",
    "Bugün her şeye yetişmen gerekmiyor.\nBiraz hava al, kendine zaman ver.\nBazen yeniden başlamak,\nyüzünü güneşe dönmekle olur. 🕊️"
  ],
  "backgroundUrl": "assets/images/kh-15.png"
},
{
  "title": "— YANINDA SUSABİLDİĞİM BİRİ",
  "text": [
    "Artık büyük sözler beklemiyorum.\nYorgunken sesimi tanıyan,\n“Anlatmak ister misin?” deyip\ncevabımı bekleyen biri olsun.",
    "Bir akşam denize karşı oturalım.\nSessizliği doldurmaya çalışmadan.\nBen başımı omzuna koyayım,\ndünya biraz kendi kendine dönsün. 🕊️"
  ],
  "backgroundUrl": "assets/images/kh-16.png"
},
{
  "title": "— BİR SARILMAYA SIĞAN DÜNYA",
  "text": [
    "Sana anlatacak çok şeyim vardı.\nBütün gün cümleler biriktirdim.\nSonra kapıyı açıp sarıldın,\nben neden yorulduğumu unuttum.",
    "O akşam hiçbir şeyi çözmedik.\nÇay soğudu, hava karardı.\nAma uzun zamandır ilk defa\nbir yere yetişmem gerekmiyordu. 🕊️"
  ],
  "backgroundUrl": "assets/images/ask3.jpg"
},
{
  "title": "— ELİMİ TUT, GERİSİ BEKLESİN",
  "text": [
    "Yarın ne olur, bilmiyorum.\nBelki yine zor bir gün geçer.\nAma sen elimi böyle tutunca\niçimdeki telaş biraz diner.",
    "Bana hiç üzülmeyeceğiz deme.\nYeter ki zor günlerde de konuşalım.\nYol bazen ikimizi de yorarsa,\nbir taşın üstünde birlikte soluklanalım. 🕊️"
  ],
  "backgroundUrl": "assets/images/ask5.jpg"
}
];

    const listView = document.getElementById('listView');
    const writingList = document.getElementById('writingList');
    const readerView = document.getElementById('readerView');
    const paper = document.getElementById('paper');
    const copy = document.getElementById('copy');
    const textElement = document.getElementById('writingText');
    const logoElement = document.getElementById('paperLogo');
    const finalSignature = document.getElementById('finalSignature');
    const controls = document.getElementById('controls');
    const backButton = document.getElementById('backButton');
    const replayButton = document.getElementById('replayButton');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let activeIndex = -1;
    let runId = 0;

    writings.forEach((writing, index) => {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.className = 'kh-writing-button';
      button.type = 'button';
      button.textContent = writing.title;
      button.addEventListener('click', () => openWriting(index));
      item.appendChild(button);
      writingList.appendChild(item);
    });

    function validUrl(value){ return /^https?:\/\//i.test(value); }
    function validBackground(value){
      return validUrl(value) || /^assets\/images\/[a-zA-Z0-9._-]+$/.test(value);
    }
    function wait(milliseconds){ return new Promise(resolve => setTimeout(resolve, milliseconds)); }
    function scrollWriting(){
      const lineHeight = parseFloat(getComputedStyle(copy).lineHeight) || 38;
      copy.scrollTop = Math.max(0, copy.scrollHeight - copy.clientHeight + lineHeight * 2);
    }

    async function typeText(element, value, speed, currentRun){
      if(reducedMotion){ element.textContent = value; scrollWriting(); return; }
      for(const character of value){
        if(currentRun !== runId) return;
        element.textContent += character;
        scrollWriting();
        await wait(speed);
      }
    }

    async function playWriting(){
      const writing = writings[activeIndex];
      const currentRun = ++runId;
      copy.classList.remove('is-fading');
      finalSignature.classList.remove('is-visible');
      textElement.innerHTML = '';
      const paragraphs = writing.text.map(value => {
        const paragraph = document.createElement('p');
        paragraph.textContent = value;
        paragraph.style.visibility = 'hidden';
        textElement.appendChild(paragraph);
        return paragraph;
      });
      copy.scrollTop = 0;

      await wait(reducedMotion ? 0 : 650);
      for(const [index, paragraphText] of writing.text.entries()){
        if(currentRun !== runId) return;
        const paragraph = paragraphs[index];
        paragraph.style.minHeight = `${paragraph.offsetHeight}px`;
        paragraph.textContent = '';
        paragraph.style.visibility = 'visible';
        await typeText(paragraph, paragraphText, 48, currentRun);
        if(index < writing.text.length - 1) await wait(reducedMotion ? 0 : 520);
      }
      if(currentRun !== runId) return;
      await wait(2000);
      if(currentRun !== runId) return;
      copy.classList.add('is-fading');
      finalSignature.classList.add('is-visible');
    }

    function openWriting(index){
      activeIndex = index;
      const writing = writings[index];
      listView.hidden = true;
      readerView.classList.add('is-open');
      controls.classList.add('is-open');
      paper.style.backgroundImage = validBackground(writing.backgroundUrl) ? `url("${writing.backgroundUrl}")` : 'none';
      if(validUrl(LOGO_URL)) logoElement.src = LOGO_URL;
      else logoElement.removeAttribute('src');
      playWriting();
    }

    function returnToList(){
      runId++;
      activeIndex = -1;
      readerView.classList.remove('is-open');
      controls.classList.remove('is-open');
      listView.hidden = false;
      copy.classList.remove('is-fading');
      finalSignature.classList.remove('is-visible');
      textElement.innerHTML = '';
    }

    backButton.addEventListener('click', returnToList);
    replayButton.addEventListener('click', playWriting);
  </script>
</body>
</html>
